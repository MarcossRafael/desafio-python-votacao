[tool.poetry]
package-mode = false

[project]
name = "desafio-python-votacao"
version = "0.1.0"
description = "API de intenções de voto"
authors = [
    {name = "Marcos Rafael do Nascimento Faria", email = "marcosrafaelnasf@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "sqlalchemy==2.0.35",
    "aiosqlite==0.20.0",
    "pydantic==2.9.2",
]

[tool.poetry.group.dev.dependencies]
pytest = "8.3.3"
pytest-asyncio = "0.24.0"
httpx = "0.27.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
